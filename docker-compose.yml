version: "3.9"

services:
  manticore:
    image: manticoresearch/manticore:latest
    container_name: tg-archive-manticore
    ports:
      - "9308:9308"
      - "9306:9306"
    #volumes:
      #- manticore-data:/var/lib/manticore/data
      #- manticore-logs:/var/log/manticore
      #- manticore-binlog:/var/lib/manticore/binlog
      #- ./manticore/manticore.conf:/etc/manticoresearch/manticore.conf:ro

    volumes:
     - ./manticore/data:/var/lib/manticore/data
     - ./manticore/logs:/var/log/manticore
     - ./manticore/binlog:/var/lib/manticore/binlog
     - ./manticore/manticore.conf:/etc/manticoresearch/manticore.conf

    environment:
      - EXTRA_SEARCHD_ARGS=--config /etc/manticoresearch/manticore.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9308/cli", "-d", "SHOW TABLES"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tg-archive-net

  tg_archive:
    build: .
    container_name: tg-archive-cli
    volumes:
      - ./data:/data
      - ./config.yaml:/app/config.yaml:ro
      - .:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      manticore:
        condition: service_healthy
    networks:
      - tg-archive-net
    stdin_open: true
    tty: true

  search:
    build: .
    container_name: tg-archive-search
    environment:
        - MANTICORE_URL=http://manticore:9308
    command: >
        sh -c "
            until curl -f http://manticore:9308/cli -d 'SHOW TABLES'; do
            echo 'Waiting for Manticore...';
            sleep 2;
            done;
            python -m search.app --output-dir /data/output --port 5000
        "
    volumes:
      - ./data/output:/data/output:ro
      - .:/app
    depends_on:
      manticore:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tg-archive-net

  web:
    image: nginx:alpine
    container_name: tg-archive-web
    ports:
      - "8080:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - search
    restart: unless-stopped
    networks:
      - tg-archive-net

networks:
  tg-archive-net:
    driver: bridge

volumes:
  manticore-data:
  manticore-logs:
  manticore-binlog:
