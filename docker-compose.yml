services:
  manticore:
    image: manticoresearch/manticore:latest
    container_name: tg-archive-manticore
    ports:
      # Только localhost: у Manticore нет аутентификации, наружу его нельзя.
      - "127.0.0.1:9308:9308"
      - "127.0.0.1:9306:9306"
    #volumes:
      #- manticore-data:/var/lib/manticore/data
      #- manticore-logs:/var/log/manticore
      #- manticore-binlog:/var/lib/manticore/binlog
      #- ./manticore/manticore.conf:/etc/manticoresearch/manticore.conf:ro

    volumes:
     - ./manticore/data:/var/lib/manticore/data
     - ./manticore/logs:/var/log/manticore
     - ./manticore/binlog:/var/lib/manticore/binlog
     - ./manticore/manticore.conf:/etc/manticoresearch/manticore.conf

    environment:
      - EXTRA_SEARCHD_ARGS=--config /etc/manticoresearch/manticore.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9308/cli", "-d", "SHOW TABLES"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tg-archive-net

  tg_archive:
    build: .
    container_name: tg-archive-cli
    volumes:
      # Весь проект целиком: конфиг использует относительные пути (tg_archive.db,
      # media/, output/), поэтому данные должны лежать рядом с кодом.
      - .:/app
      - ./config.yaml:/app/config.yaml:ro
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      manticore:
        condition: service_healthy
    networks:
      - tg-archive-net
    stdin_open: true
    tty: true

  search:
    build: .
    container_name: tg-archive-search
    environment:
        - MANTICORE_URL=http://manticore:9308
        - TG_ARCHIVE_CONFIG=/app/config.yaml
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "--threads", "4",
              "--timeout", "20", "--graceful-timeout", "10", "--access-logfile", "-",
              "search.app:app"]
    working_dir: /app
    volumes:
      - .:/app:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      manticore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - tg-archive-net

  web:
    image: nginx:alpine
    container_name: tg-archive-web
    ports:
      # Наружу сайт выставляется через I2P-туннель или отдельный reverse-proxy.
      # Публичный IP:порт здесь открывать не нужно.
      - "127.0.0.1:8080:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - search
    restart: unless-stopped
    networks:
      - tg-archive-net

networks:
  tg-archive-net:
    driver: bridge

volumes:
  manticore-data:
  manticore-logs:
  manticore-binlog:
