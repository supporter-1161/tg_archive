events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Не палим версию nginx
    server_tokens off;

    # Лимит на поиск: одна и та же страница дороже, чем статика.
    # 20 запросов в минуту с IP + всплеск до 10.
    limit_req_zone $binary_remote_addr zone=search_zone:10m rate=20r/m;
    limit_req_status 429;
    # Сообщения limit_req пишутся в error_log вместе с IP клиента. Для
    # анонимного архива оставляем только crit — статистику берём из access_log.
    error_log /dev/stderr crit;

    # Анонимный лог: без IP и без query string (в поиске бывают личные запросы).
    # Нужен только для счётчиков: сколько запросов и сколько 429.
    log_format anon '$time_iso8601 $status $uri $request_time';
    access_log /dev/stdout anon;

    gzip on;
    gzip_types text/css text/plain application/xml;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Логи — только анонимные (см. log_format anon), IP не пишем.

        # Пользовательские сообщения не принимаются через веб — тело не нужно.
        client_max_body_size 64k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # JS на сайте нет вообще — запрещаем его на уровне браузера.
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        # Человеческая страница вместо голого 429 от nginx.
        error_page 429 = @rate_limited;
        location @rate_limited {
            internal;
            default_type "text/html; charset=utf-8";
            add_header Retry-After 60 always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'" always;
            return 429 '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Слишком много запросов</title></head><body style="font-family:sans-serif;padding:2rem"><h1>Слишком много запросов</h1><p>Поиск ограничен: не больше 20 запросов в минуту с одного адреса. Подождите минуту и повторите.</p><p><a href="/">Вернуться на главную</a></p></body></html>';
        }

        location /static/ {
            # Без immutable: после правок CSS возвращающиеся посетители не
            # должны месяц смотреть старую вёрстку.
            expires 7d;
        }

        location /media/ {
            expires 7d;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location /search {
            limit_req zone=search_zone burst=10 nodelay;

            proxy_pass http://tg-archive-search:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }
    }
}
