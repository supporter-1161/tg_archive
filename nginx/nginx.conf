events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Не палим версию nginx
    server_tokens off;

    # Лимит на поиск: одна и та же страница дороже, чем статика.
    # 20 запросов в минуту с IP + всплеск до 10.
    limit_req_zone $binary_remote_addr zone=search_zone:10m rate=20r/m;
    limit_req_status 429;

    gzip on;
    gzip_types text/css text/plain application/xml;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Для анонимного архива: не храним IP посетителей.
        access_log off;

        # Пользовательские сообщения не принимаются через веб — тело не нужно.
        client_max_body_size 64k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # JS на сайте нет вообще — запрещаем его на уровне браузера.
        add_header Content-Security-Policy "default-src 'self'; script-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

        location /static/ {
            # Без immutable: после правок CSS возвращающиеся посетители не
            # должны месяц смотреть старую вёрстку.
            expires 7d;
        }

        location /media/ {
            expires 7d;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location /search {
            limit_req zone=search_zone burst=10 nodelay;

            proxy_pass http://tg-archive-search:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }
    }
}
